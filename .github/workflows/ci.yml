# The mock-bus unit and regression tests, plus a compile of the Linux
# userspace programs (CLI, hardware check, driver comparison, IRQ check,
# poll-versus-interrupt check).
# The kernel module and the on-target runs need the Pi, its kernel headers,
# and the ADXL345, so they stay out of this job.
name: CI

on:
  push:
  pull_request:

jobs:
  userspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install g++ 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Build and run the mock-bus tests
        run: make test CXX=g++-14

  cppcheck:
      name: Cppcheck static analysis
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4
        - name: Install Cppcheck
          run: sudo apt-get update && sudo apt-get install -y cppcheck
        - name: Analyze project-owned C/C++ sources
          run: |
            cppcheck --error-exitcode=1 --quiet --enable=warning,performance,portability \
              --inline-suppr --suppress=missingIncludeSystem --suppress=passedByValue --std=c++20 \
              -Iinclude include src tests kernel/adxl345_custom.c
